<body>
<header class="nav"><a class="brand" href="/">BURNA</a><a class="cta cta-sm" href="/">Home</a></header>
<main class="doc">
<!-- Served for every profile link, burna.win/u/{code}, opened without the app (see _redirects). It shows nothing about
     the player. -->
<div id="profile">
<h1>FOLLOW ON BURNA</h1>
<p>With Burna on your iPhone, this link opens this player’s profile so you can follow them.</p>
<p><a class="cta" id="open" href="https://apps.apple.com/app/id6826509642">Open in Burna</a></p>
<p>No Burna yet? <a href="https://apps.apple.com/app/id6826509642">Get it on the App Store</a>, then open this link again.</p>
</div>
</main>
<footer class="foot"><span>© 2026 Burna</span><nav><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/support.html">Support</a></nav></footer>
<script>
  var m = location.pathname.match(/^\/u\/([A-Za-z0-9]{7})\/?$/);
  // An installed app opens the link itself. This button is for when it didn't, such as in another app's browser.
  if (m) document.getElementById('open').href = 'burna://profile/' + m[1];
</script>
</body>
