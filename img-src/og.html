<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image</title>
<!-- og.png, 1200 x 630. Rendered by render.sh after the phone screens, since it shows the board. -->
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url(../fonts/BarlowCondensed-ExtraBold.woff2) format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 600; src: url(../fonts/Barlow-SemiBold.woff2) format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0A0A0B; color: #fff; -webkit-font-smoothing: antialiased; position: relative; }
  .glow { position: absolute; right: 90px; top: 80px; width: 520px; height: 520px; border-radius: 50%; background: rgba(250,252,77,.12); filter: blur(120px); }
  .copy { position: absolute; left: 80px; top: 72px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { height: 112px; }
  .brand span { font: 800 56px/1 "Barlow Condensed", sans-serif; letter-spacing: 10px; }
  h1 { margin-top: 44px; font: 800 120px/.9 "Barlow Condensed", sans-serif; color: #FAFC4D; text-transform: uppercase; }
  p { margin-top: 30px; font: 600 22px/1.3 "Barlow", sans-serif; letter-spacing: 3px; color: #8C8C93; }
  .phone { position: absolute; right: 96px; top: 64px; width: 330px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand"><img src="../img/logo.svg" alt=""><span>BURNA</span></div>
    <h1>Weekly fitness leaderboard</h1>
    <p>FREE ON THE APP STORE · IPHONE</p>
  </div>
  <img class="phone" src="../img/screen-board.webp" alt="">
</body>
</html>
