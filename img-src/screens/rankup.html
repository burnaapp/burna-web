<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rank up</title>
<!-- SportMedalUpView, at its last frame: RANK UP, the badge with its stars, the new rank's name, CONTINUE. -->
<link rel="stylesheet" href="phone.css">
<style>
  .glow { position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -250px 0 0 -210px; border-radius: 50%;
          background: rgba(211,44,230,.5); filter: blur(110px); }
  .stack { position: absolute; inset: 54px 0 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .head { font-size: 34px; letter-spacing: 8px; padding-left: 8px; }
  .badge { width: 240px; height: 254px; display: block; }
  .name { font-size: 64px; line-height: 1.1; color: var(--athlete); }
  .go { position: absolute; left: 24px; right: 24px; bottom: 64px; min-height: 54px; display: grid; place-items: center;
        border: 2px solid var(--athlete); border-radius: 99px; color: var(--athlete); font-size: 24px; letter-spacing: 1.6px; }
</style>
</head>
<body>
<div class="device"><div class="screen">
  <div class="status"><span class="time">9:41</span></div><div class="island"></div>
  <div class="glow"></div>
  <div class="stack">
    <p class="head d7">RANK UP</p>
    <img class="badge" src="rank-athlete-2.svg" alt="">
    <p class="name d">ATHLETE II</p>
  </div>
  <div class="go d">CONTINUE</div>
  <div class="home-bar"></div>
</div></div>
</body>
</html>
